name: Release

on:
  push:
    tags:
      - 'v*'

# Scoped per job rather than workflow-wide: check-branch only reads, and the called CI
# workflow declares contents: read for itself. Only the job that publishes needs write.
#
# Every action is pinned by commit, not by tag. A tag can be repointed, and the actions in
# the release job run beside contents: write and id-token: write, publishing the binaries
# `unity-sync update` installs unattended; the ones in the CI job decide whether a build
# ships at all. The comment on each is the readable half; the SHA is the enforced one.
permissions:
  contents: read

jobs:
  check-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Verify tag is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor ${{ github.sha }} origin/main || {
            echo "Error: tag must point to a commit on main"
            exit 1
          }

  test:
    needs: check-branch
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # `unity-sync update` installs these binaries unattended, and TLS to GitHub was the
      # only thing vouching for them. Provenance is a signed statement, verifiable with
      # `gh attestation verify <file> --repo curbol/unity-sync`, that this workflow built
      # this artifact from this commit.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build release artifacts
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          mkdir -p dist

          platforms=(
            "darwin/amd64/mac-intel"
            "darwin/arm64/mac-apple"
            "linux/amd64/linux-intel"
            "linux/arm64/linux-arm64"
            "windows/amd64/win"
          )

          for p in "${platforms[@]}"; do
            IFS='/' read -r goos goarch label <<< "$p"
            bin="unity-sync"
            if [ "$goos" = "windows" ]; then bin="unity-sync.exe"; fi

            CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch go build \
              -ldflags "-X main.version=${VERSION}" \
              -o "dist/$bin" .
            (cd dist && zip "unity-sync-${VERSION}-${label}.zip" "$bin" && rm "$bin")
          done

      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: dist/*.zip
